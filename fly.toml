# fly.toml app configuration file generated for backend-nghiencf on 2026-01-14T18:35:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-nghiencf'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'   # hoặc 'off' để luôn chạy (tốn hơn nếu idle)
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
